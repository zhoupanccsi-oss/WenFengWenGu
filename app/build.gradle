plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenfeng.wengu'
    compileSdk 36

    signingConfigs {
        release {
            // Read from local.properties or environment variables — never hardcode
            def props = new Properties()
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            storeFile file(props.getProperty('STORE_FILE', '../wenfeng.jks'))
            storePassword props.getProperty('STORE_PASSWORD', System.getenv('STORE_PASSWORD') ?: '')
            keyAlias props.getProperty('KEY_ALIAS', System.getenv('KEY_ALIAS') ?: '')
            keyPassword props.getProperty('KEY_PASSWORD', System.getenv('KEY_PASSWORD') ?: '')
        }
    }

    defaultConfig {
        applicationId "com.wenfeng.wengu"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    // Google Play Billing for in-app purchase
    implementation 'com.android.billingclient:billing:6.2.1'
}
